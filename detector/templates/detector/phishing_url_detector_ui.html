
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .verdict-label {
    font-size: 18px;

  .conf-row {
    display: flex;
    justify-content: space-between;

  .conf-label {

  .conf-value.safe { color: #3B6D11; }

    border-radius: 999px;

  .conf-bar-fill {
    height: 100%;
    border-radius: 999px;
    width: 0%;
    transition: width 0.8s cubic-bezier(0.16,1,0.3,1);

  .conf-bar-fill.phishing { background: #E24B4A; }
  .conf-bar-fill.safe { background: #639922; }

  .features-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 8px;
    margin-top: 1rem;
  }

  .feature-chip {
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md);
    padding: 8px 10px;
    text-align: center;
  }

  .feature-chip-val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 500;
    color: var(--color-text-primary);
    line-height: 1.2;

  .feature-chip-name {
    font-family: 'IBM Plex Mono', monospace;

  }

  .history-section {
    max-width: 600px;
    margin: 0 auto;
  }

  .history-label {
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--color-text-secondary);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding-left: 2px;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .history-item {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md);

    display: flex;
    align-items: center;

    cursor: pointer;
    transition: background 0.1s;
  }

  .history-item:hover {
    background: var(--color-background-secondary);
  }

  .history-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .history-dot.phishing { background: #E24B4A; }
  .history-dot.safe { background: #639922; }

  .history-url {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--color-text-secondary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }

  .history-verdict {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    flex-shrink: 0;
  }

  .history-verdict.phishing { color: #E24B4A; }
  .history-verdict.safe { color: #3B6D11; }

  .error-card {
    display: none;
    max-width: 600px;
    margin: 0 auto 1rem;
    background: #FCEBEB;
    border: 0.5px solid #F09595;
    border-radius: var(--border-radius-lg);
    padding: 1rem 1.25rem;
  }

  .error-title {
    font-size: 13px;
    font-weight: 700;
    color: #A32D2D;

  }

  .error-msg {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #791F1F;
  }
</style>

        <path d="M18 3L5 8v10c0 8.284 5.594 16.033 13 18 7.406-1.967 13-9.716 13-18V8L18 3z" stroke="#E24B4A" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M12 18l4 4 8-8" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

        <button class="quick-btn" onclick="prefill('http://192.168.1.1/bank-login')">ip address</button>
        <button class="quick-btn" onclick="prefill('https://github.com/torvalds/linux')">github</button>
        <button class="quick-btn" onclick="prefill('http://secure-update-password-confirm.net/verify')">fake bank</button>
      </div>

  <div class="loading-card" id="loadingCard">

<script>
const SUSPICIOUS_WORDS = ['login','verify','secure','account','update','bank','confirm','password','credit','signin'];
const SAFE_DOMAINS = ['google.com','youtube.com','facebook.com','microsoft.com','apple.com','github.com'];
const loadingMsgs = ['// analyzing url structure...','// extracting features...','// running random forest...','// computing threat score...'];
let scanHistory = [];

function prefill(url) {
  document.getElementById('urlInput').value = url;
  document.getElementById('urlInput').focus();
}

function extractFeatures(url) {
  let parsed;
  try { parsed = new URL(url); } catch(e) { parsed = { protocol: '', hostname: '', pathname: url }; }
  const domain = parsed.hostname || '';
  const dots = (url.match(/\./g) || []).length;
  const hyphens = (url.match(/-/g) || []).length;
  const slashes = (url.match(/\//g) || []).length;
  const hasIp = /^\d+\.\d+\.\d+\.\d+/.test(domain);
  const suspCount = SUSPICIOUS_WORDS.filter(w => url.toLowerCase().includes(w)).length;
  const isSafe = SAFE_DOMAINS.some(s => domain.includes(s));
  return {
    'url_length': url.length,
    'has_https': parsed.protocol === 'https:' ? 1 : 0,
    'has_at': url.includes('@') ? 1 : 0,
    'num_dots': dots,
    'num_hyphens': hyphens,
    'num_slashes': slashes,
    'has_ip': hasIp ? 1 : 0,
    'suspicious_words': suspCount,
    'safe_domain': isSafe ? 1 : 0,
  };
}

function localPredict(url) {
  const f = extractFeatures(url);
  let score = 0;
  if (f.url_length > 75) score += 20;
  if (f.url_length > 100) score += 15;
  if (f.has_https === 0) score += 15;
  if (f.has_at) score += 25;
  if (f.num_dots > 4) score += 10;
  if (f.num_hyphens > 3) score += 15;
  if (f.has_ip) score += 30;
  score += f.suspicious_words * 15;
  if (f.safe_domain) score = Math.max(0, score - 40);
  const confidence = Math.min(98, Math.max(52, score > 40 ? 60 + score * 0.3 : 90 - score * 0.6));
  const isPhishing = score > 40;
  return {
    is_phishing: isPhishing,
    confidence: parseFloat(confidence.toFixed(1)),
    verdict: isPhishing ? 'Phishing Detected' : 'Safe',
    features: f
  };
}

function renderFeatures(features, isPhishing) {
  const labels = {
    'url_length': ['LEN', v => v, v => isPhishing && v > 75],
    'has_https': ['HTTPS', v => v ? 'YES' : 'NO', v => !v],
    'has_at': ['@ SYMBOL', v => v ? 'YES' : 'NO', v => v],
    'num_dots': ['DOTS', v => v, v => v > 4],
    'num_hyphens': ['HYPHENS', v => v, v => v > 3],
    'suspicious_words': ['KEYWORDS', v => v, v => v > 0],
    'has_ip': ['IP ADDR', v => v ? 'YES' : 'NO', v => v],
    'safe_domain': ['KNOWN SAFE', v => v ? 'YES' : 'NO', () => false],
  };
  const grid = document.getElementById('featuresGrid');
  grid.innerHTML = '';
  Object.entries(labels).forEach(([key, [label, fmt, isFlag]]) => {
    if (features[key] === undefined) return;
    const val = features[key];
    const flagged = isFlag(val);
    const chip = document.createElement('div');
    chip.className = 'feature-chip' + (flagged ? ' flag' : '');
    chip.innerHTML = `<div class="feature-chip-val">${fmt(val)}</div><div class="feature-chip-name">${label}</div>`;
    grid.appendChild(chip);
  });
}

async function runScan() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return;

  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('errorCard').style.display = 'none';
  document.getElementById('loadingCard').style.display = 'block';

  const bar = document.getElementById('loadingBar');
  const txt = document.getElementById('loadingText');
  let step = 0;
  bar.style.width = '15%';
  const interval = setInterval(() => {
    step++;
    if (step < loadingMsgs.length) {
      txt.textContent = loadingMsgs[step];
      bar.style.width = (15 + step * 22) + '%';
    }
  }, 300);

  await new Promise(r => setTimeout(r, 1200));
  clearInterval(interval);
  bar.style.width = '100%';
  await new Promise(r => setTimeout(r, 200));

  let result;
  try {
    const resp = await fetch('/api/detect/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    if (resp.ok) {
      result = await resp.json();
      result.features = extractFeatures(url);
    } else {
      result = localPredict(url);
    }
  } catch(e) {
    result = localPredict(url);
  }

  document.getElementById('loadingCard').style.display = 'none';
  btn.disabled = false;

  const isPhishing = result.is_phishing;
  const cls = isPhishing ? 'phishing' : 'safe';

  const icon = document.getElementById('verdictIcon');
  const svg = document.getElementById('verdictSvg');
  icon.className = 'verdict-icon ' + cls;
  if (isPhishing) {
    svg.innerHTML = '<path d="M11 4L2 19h18L11 4z" stroke="#E24B4A" stroke-width="1.5" stroke-linejoin="round" fill="none"/><line x1="11" y1="9" x2="11" y2="14" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/><circle cx="11" cy="17" r="0.8" fill="#E24B4A"/>';
  } else {
    svg.innerHTML = '<path d="M5 11l4 4 8-8" stroke="#639922" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
  }

  document.getElementById('verdictLabel').textContent = result.verdict;
  document.getElementById('verdictLabel').className = 'verdict-label ' + cls;
  document.getElementById('verdictSub').textContent = isPhishing ? '// threat detected — do not visit' : '// url appears legitimate';
  document.getElementById('resultUrl').textContent = url;

  const confEl = document.getElementById('confValue');
  confEl.textContent = result.confidence + '%';
  confEl.className = 'conf-value ' + cls;

  const confBar = document.getElementById('confBar');
  confBar.className = 'conf-bar-fill ' + cls;
  setTimeout(() => { confBar.style.width = result.confidence + '%'; }, 50);

  if (result.features) renderFeatures(result.features, isPhishing);

  document.getElementById('resultCard').style.display = 'block';

  scanHistory.unshift({ url, verdict: result.verdict, isPhishing });
  if (scanHistory.length > 5) scanHistory.pop();
  renderHistory();
}

function renderHistory() {
  const section = document.getElementById('historySection');
  const list = document.getElementById('historyList');
  if (scanHistory.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  list.innerHTML = '';
  scanHistory.forEach(item => {
    const el = document.createElement('div');
    el.className = 'history-item';
    const cls = item.isPhishing ? 'phishing' : 'safe';
    el.innerHTML = `<div class="history-dot ${cls}"></div><span class="history-url">${item.url}</span><span class="history-verdict ${cls}">${item.verdict}</span>`;
    el.onclick = () => prefill(item.url);
    list.appendChild(el);
  });
}

document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') runScan();
});
</script>
